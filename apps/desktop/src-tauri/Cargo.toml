[package]
name = "chripify"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"

[features]
default = []
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "sync", "time", "rt", "macros"] }
rusqlite = { version = "=0.41.1", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
fs2 = "0.4"

[profile.release]
panic = "abort"
strip = true
lto = true
codegen-units = 1
